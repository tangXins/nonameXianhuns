<html lang="zh-CN">

<title>绿洲大亨</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
html, body {
    width: 100%;
    height: 100%;
    background: #000;
    font-family: 'Microsoft YaHei', sans-serif;
    writing-mode: horizontal-tb;

}
/* 遮罩层 */
.overlay {
    position: fixed;
    top: 0;
    left: 0;

    height: 100%;

    align-items: center;
    justify-content: center;
}
/* 主面板 - 全屏自适应 */
.panel {

    display: flex;
    flex-direction: column;
    width: 98%;
    height: 96%;
    max-width: 1600px;
    background: linear-gradient(160deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);

    border-radius: 16px;
    padding: 16px 20px;

}
/* 顶部标题栏 */

    display: flex;
    justify-content: space-between;
    align-items: center;

    padding-bottom: 10px;
    border-bottom: 2px solid rgba(255,215,0,0.3);
    flex-shrink: 0;
}
.title-group {
    display: flex;
    align-items: center;
    gap: 12px;
}
.icon-box {
    width: 48px;
    height: 48px;

}
.title-box {
    display: flex;

}
.title {
    color: #FFD700;
    font-size: 26px;
    font-weight: bold;

}
.sub-title {
    color: rgba(255,255,255,0.6);
    font-size: 12px;
    margin-top: 2px;
}
.btn-group {

    gap: 10px;
}
.btn {
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
}
.btn-upgrade {

}

}

/* 资源总览栏 */

    flex-shrink: 0;
}
.resource-card {
    background: linear-gradient(135deg, rgba(255,215,0,0.15), rgba(255,255,255,0.05));
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    padding: 12px 10px;
    text-align: center;
}
.resource-icon {
    font-size: 20px;
}
.resource-name {

}
.resource-value {

}
/* 区域导航 */
.zone-title {
    color: #FFD700;
    font-size: 15px;
    margin-bottom: 8px;
    font-weight: bold;
    flex-shrink: 0;
}
.zone-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    margin-bottom: 12px;
    flex-shrink: 0;
}

    overflow: hidden;

}
.zone-card-corner {

}
.zone-icon {

}
.zone-name {

}
.zone-desc {

}
.level-row {

    align-items: center;
}
.zone-level-badge {
    display: inline-block;

    border-radius: 12px;
    font-size: 12px;
    font-weight: bold;
}
.enter-hint {
    color: rgba(255,255,255,0.5);
    font-size: 11px;
}
/* 资源详情面板 */
.detail-title {
    color: #FFD700;
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 8px;
    flex-shrink: 0;
}
.tab-bar {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
    flex-shrink: 0;
}
.tab-btn {
    padding: 6px 12px;
    border-radius: 6px;

    font-size: 12px;
}
.tab-btn.active {
    background: rgba(255,215,0,0.3);
    color: #FFD700;
}
.tab-btn.inactive {
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.7);
}
/* 滚动区 - 占满剩余空间 */
.scroll-area {
    background: rgba(0,0,0,0.4);
    border-radius: 12px;
    padding: 14px;
    border: 1px solid rgba(255,215,0,0.2);
    margin-bottom: 10px;

    flex: 1;
    min-height: 0;
    scrollbar-width: none;
    -ms-overflow-style: none;
}
.scroll-area::-webkit-scrollbar {
    display: none;
}
/* 资源Tab内容 */
.tab-content {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    margin-bottom: 10px;
    padding: 5px;
}
.tab-content.hidden {
    display: none;
}
.resource-item {
    background: rgba(255,255,255,0.06);
    border-radius: 10px;
    padding: 10px 8px;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.08);
}
.resource-item-name {
    color: rgba(255,255,255,0.85);
    font-size: 12px;
    margin-bottom: 4px;
}
.resource-item-value {
    color: #FFD700;
    font-size: 18px;
    font-weight: bold;
    margin-top: 2px;
    text-shadow: 0 0 6px rgba(255,215,0,0.3);
}
.forge-item {
    border-radius: 10px;
    padding: 10px 8px;
    text-align: center;
}
.forge-item.normal {
    background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
    border: 1px solid rgba(255,255,255,0.08);
}
.forge-item.high {
    background: linear-gradient(135deg, rgba(255,215,0,0.2), rgba(255,255,255,0.02));
    border: 1px solid #FFD700;
}
.forge-name {
    color: #fff;
    font-size: 12px;
    margin-bottom: 4px;
}
.forge-level {
    color: rgba(255,255,255,0.5);
    font-size: 10px;
}
.forge-value {
    font-size: 18px;
    font-weight: bold;
    margin-top: 2px;
}
.forge-value.high {
    color: #FFD700;
}
.forge-value.normal {
    color: #fff;
}
/* 底部状态栏 */
.status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 10px;
    border-top: 1px solid rgba(255,215,0,0.2);
    flex-shrink: 0;
}
.status-info {
    color: rgba(255,255,255,0.5);
    font-size: 11px;
}
.date-info {
    color: rgba(255,255,255,0.4);
    font-size: 11px;
}
/* ==================== 区域页面通用样式 ==================== */
.zone-panel {
    position: relative;
    display: flex;
    flex-direction: column;
    width: 98%;
    max-width: 1600px;
    height: 96%;
    background: linear-gradient(160deg,#1a1a2e,#16213e);

}

/* 子Tab */
.sub-tabs {

}
.sub-tab {

}

/* 卡片网格 */
.card-grid {

}
.point-card {

    border-radius: 12px;

}

}

}

.two-col-layout {

}

}

}

}
.dest-item-level {

.dest-item-desc {

/* 详情面板 */

}

}
.detail-section {

}
.detail-section-title {

.detail-action-bar {
